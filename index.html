<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amogh V. Sahasrabuddhe, Automotive Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="cursor"></div>
<div id="cursor-dot"></div>
<div id="progress"></div>

<!-- NAV -->
<nav>
  <a href="#" class="nav-logo" id="nav-logo">AVS</a>
  <ul class="nav-links">
    <li><a href="#about">About</a></li>
    <li><a href="#experience">Experience</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<!-- HERO -->
<section id="hero">
  <div class="hero-left">
    <p class="hero-eyebrow fade" id="hero-eyebrow"></p>
    <h1 class="hero-name fade fade-d1"><span id="hero-name-l1"></span><br><span id="hero-name-l2"></span></h1>
    <p class="hero-title fade fade-d2" id="hero-title"></p>
    <p class="hero-bio fade fade-d2" id="hero-bio"></p>
    <div class="hero-actions fade fade-d3">
      <a href="#experience" class="btn btn-gold">View Work ↓</a>
      <a href="#contact" class="btn btn-ghost">Contact Me</a>
    </div>
  </div>
  <div class="hero-right">
    <img id="hero-image" src="" style="width:100%;height:100%;object-fit:cover;filter:brightness(0.5) saturate(0.7);transition:filter 0.5s;" alt="Hero">
  </div>
</section>

<!-- ABOUT -->
<div id="about">
  <div class="about-inner">
    <div class="about-photo-wrap fade">
      <img id="about-photo" src="" class="about-photo" alt="Amogh Sahasrabuddhe">
      <div class="about-photo-label" id="about-photo-label"></div>
    </div>
    <div class="about-text-wrap">
      <p class="eyebrow fade" id="about-eyebrow"></p>
      <h2 class="fade fade-d1"><span id="about-heading-l1"></span><br><em id="about-heading-em"></em></h2>
      <p class="about-bio fade fade-d1" id="about-bio"></p>
      <div class="skills-list fade fade-d2" id="skills-list"></div>
      <div class="edu-row fade fade-d3" id="edu-row"></div>
    </div>
  </div>
</div>

<!-- EXPERIENCE -->
<section id="experience" class="section">
  <p class="eyebrow fade" id="exp-eyebrow"></p>
  <h2 class="fade fade-d1"><span id="exp-heading-l1"></span> <em id="exp-heading-em"></em></h2>
  <div class="exp-timeline" id="exp-timeline"></div>
</section>

<!-- PROJECTS -->
<div id="projects">
  <div class="projects-inner">
    <p class="eyebrow fade" id="proj-eyebrow"></p>
    <h2 class="fade fade-d1"><span id="proj-heading-l1"></span> <em id="proj-heading-em"></em></h2>
    <div class="proj-grid" id="proj-grid"></div>
  </div>
</div>

<!-- CONTACT -->
<section id="contact">
  <div class="contact-inner">
    <div class="fade">
      <p class="eyebrow" id="contact-eyebrow"></p>
      <div class="contact-big-text"><span id="contact-heading-l1"></span><br>Something <em id="contact-heading-em"></em></div>
      <div class="contact-quote" id="contact-quote"></div>
    </div>
    <div class="fade fade-d2">
      <div class="contact-links">
        <a href="#" id="contact-email" class="clink">
          <span class="clink-icon">✉</span>
          <span id="contact-email-text"></span>
        </a>
        <a href="#" id="contact-phone" class="clink">
          <span class="clink-icon">☎</span>
          <span id="contact-phone-text"></span>
        </a>
        <a href="#" id="contact-linkedin" target="_blank" class="clink">
          <span class="clink-icon">in</span>
          LinkedIn Profile
        </a>
        <div class="clink" style="cursor:default;">
          <span class="clink-icon">📍</span>
          <span id="contact-location"></span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <span id="footer-name"></span>
  <span id="footer-role"></span>
</footer>

<!-- MODAL SYSTEM -->
<div id="modal-overlay" onclick="closeModal()">
  <div id="modal-box" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">&#215;</button>
    <div class="modal-inner" id="modal-content"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
